spec: "1.0"

devices:
  HMP4040:
    eom:
      ASRL INSTR:
        q: "\r\n"
        r: "\n"
    error: "HMP4040 dummy error"
    dialogues:
      - q: "*IDN?"
        r: "Rohde&Schwarz,HMP4040,DUMMY,SIM"
      - q: "SYST:LOC"
        r: OK
      - q: "SYST:REM"
        r: OK
      - q: "SYST:MIX"
        r: OK
      - q: "SYST:ERR?"
        r: "ERROR 0,No error"

    properties:
      channel:
        default: 1
        getter:
          q: "INST:NSEL?"
          r: "{:d}"
        setter:
          q: "INST OUT{:d}"
        specs:
          valid: [1, 2, 3, 4]
          type: int

      voltage:
        default: 0.0
        getter:
          q: "MEAS:VOLT?"
          r: "{:.2f}"
        setter:
          q: "VOLT {:.2f}"
        specs:
          min: 0.0
          max: 32.0
          type: float

      current:
        default: 0.0
        getter:
          q: "MEAS:CURR?"
          r: "{:.2f}"
        setter:
          q: "CURR {:.2f}"
        specs:
          min: -10.0
          max: 10.0
          type: float

      current_limit:
        default: 5.0
        getter:
          q: "VOLT ILIM?"
          r: "{:.2f}"
        setter:
          q: "VOLT ILIM {:.2f}"
        specs:
          min: -10.0
          max: 10.0
          type: float

      voltage_limit:
        default: 32.0
        getter:
          q: "CURR VLIM?"
          r: "{:.2f}"
        setter:
          q: "CURR VLIM {:.2f}"
        specs:
          min: -10.0
          max: 32.0
          type: float

      output:
        default: 0
        setter:
          q: "OUTP {:d}"
        specs:
          valid: [0, 1]
          type: int

      output_all:
        default: 0
        getter:
          q: "OUTP:GEN?"
          r: "{:d}"
        setter:
          q: "OUTP:GEN {:d}"
        specs:
          valid: [0, 1]
          type: int

      display_current:
        default: 0.0
        getter:
          q: "CURR?"
          r: "{:.2f}"
        setter:
          q: "notused {:.2f}"
          r: "notused"
        specs:
          type: float

      display_voltage:
        default: 0.0
        getter:
          q: "VOLT?"
          r: "{:.2f}"
        setter:
          q: "notused2 {:.2f}"
          r: "notused"
        specs:
          type: float

      display_output:
        getter:
          q: "OUTP:SEL?"
          r: "{:d}"

  K2400:
    eom:
      GPIB INSTR:
        q: "\r\n"
        r: "\n"
    error: "Keithley Instruments,2400,dummy,psu"
    dialogues:
      - q: "*IDN?"
        r: "K2400 ID"
    properties:
      output:
        default: 0
        getter:
          q: "OUTP?"
          r: "{:d}"
        setter:
          q: "OUTP {:d}"
        specs:
          valid: [0, 1]
          type: int

      current:
        default: 0.0
        getter:
          q: "MEAS:CURR?"
          r: "{:.2f}"
        setter:
          q: "SOUR:CURR {:.2f}"
        specs:
          min: -10.0
          max: 10.0
          type: float

      current_limit:
        default: 5.0
        getter:
          q: "SOUR:VOLT:ILIMIT?"
          r: "{:.2f}"
        setter:
          q: "SOUR:VOLT:ILIMIT {:.2f}"
        specs:
          min: -10.0
          max: 10.0
          type: float

      voltage:
        default: 0.0
        getter:
          q: "MEAS:VOLT?"
          r: "{:.2f}"
        setter:
          q: "SOUR:VOLT {:.2f}"
        specs:
          min: 0.0
          max: 32.0
          type: float

      voltage_limit:
        default: 32.0
        getter:
          q: "SOUR:CURR:VLIMIT?"
          r: "{:.2f}"
        setter:
          q: "SOUR:CURR:VLIMIT {:.2f}"
        specs:
          min: 0.0
          max: 32.0
          type: float

      source_function:
        default: "VOLT"
        setter:
          q: "SOUR:FUNC {:s}"
        specs:
          valid: ["VOLT", "CURR"]
          type: str

      autorange:
        default: 1
        setter:
          q: "SOUR:CURR:RANG:AUTO {:d}"
        specs:
          valid: [0, 1]
          type: int

      voltage_range:
        default: 32.0
        setter:
          q: "SOUR:VOLT:RANG {:.2f}"
        specs:
          min: 0.0
          max: 32.0
          type: float

      display_voltage:
        default: 0.0
        getter:
          q: "SOUR:VOLT?"
          r: "{:.2f}"
        specs:
          min: 0.0
          max: 32.0
          type: float

      display_current:
        default: 0.0
        getter:
          q: "SOUR:CURR?"
          r: "{:.2f}"
        specs:
          min: 0.0
          max: 5.0
          type: float

      four_wire_sense:
        default: 0
        setter:
          q: ":SENSE:CURRENT:RSENSE {:d}"
        specs:
          valid: [0, 1]
          type: int

  K2450:
    eom:
      USB INSTR:
        q: "\r\n"
        r: "\n"
    error: "Error from K2450 dummy psu"
    dialogues:
      - q: "*IDN?"
        r: "K2450 ID"
    properties:
      output:
        default: 0
        getter:
          q: "OUTP?"
          r: "{:d}"
        setter:
          q: "OUTP {:d}"
          # r: OK
        specs:
          valid: [0, 1]
          type: int

      current:
        default: 0.0
        getter:
          q: "MEAS:CURR?"
          r: "{:.2f}"
        setter:
          q: "SOUR:CURR {:.2f}"
          # r: OK
        specs:
          min: -10.0
          max: 10.0
          type: float

      current_limit:
        default: 5.0
        getter:
          q: "SOUR:VOLT:ILIMIT?"
          r: "{:.2f}"
        setter:
          q: "SOUR:VOLT:ILIMIT {:.2f}"
          # r: Ok
        specs:
          min: -10.0
          max: 10.0
          type: float

      voltage:
        default: 0.0
        getter:
          q: "MEAS:VOLT?"
          r: "{:.2f}"
        setter:
          q: "SOUR:VOLT {:.2f}"
          # r: OK
        specs:
          min: 0.0
          max: 32.0
          type: float

      voltage_limit:
        default: 32.0
        getter:
          q: "SOUR:CURR:VLIMIT?"
          r: "{:.2f}"
        setter:
          q: "SOUR:CURR:VLIMIT {:.2f}"
          r: OK
        specs:
          min: 0.0
          max: 32.0
          type: float

      source_function:
        default: "VOLT"
        setter:
          q: "SOUR:FUNC {:s}"
          r: OK
        specs:
          valid: ["VOLT", "CURR"]
          type: str

      autorange:
        default: 1
        setter:
          q: "SOUR:CURR:RANG:AUTO {:d}"
          r: OK
        specs:
          valid: [0, 1]
          type: int

      voltage_range:
        default: 32.0
        setter:
          q: "SOUR:VOLT:RANG {:.2f}"
          r: OK
        specs:
          min: 0.0
          max: 32.0
          type: float

      display_voltage:
        default: 0.0
        getter:
          q: "SOUR:VOLT?"
          r: "{:.2f}"
        specs:
          min: 0.0
          max: 32.0
          type: float

      display_current:
        default: 0.0
        getter:
          q: "SOUR:CURR?"
          r: "{:.2f}"
        specs:
          min: -10.0
          max: 10.0
          type: float

      four_wire_sense:
        default: 0
        setter:
          q: ":SENSE:CURRENT:RSENSE {:d}"
          r: OK
        specs:
          valid: [0, 1]
          type: int

  K6500:
    eom:
      USB INSTR:
        q: "\r\n"
        r: "\n"

    error: "K6500 error"

    dialogues:
      - q: "*IDN?"
        r: "Keithley Instruments,6500,dummy,1.0"

      - q: "*RST"
        r: OK

    properties:
      voltage:
        default: 0.000
        getter:
          q: "MEAS:VOLT?"
          r: "{:.6f}"
        specs:
          min: -1000.0
          max: 1000.0
          type: float

      channel:
        default: 1
        getter:
          q: "ROUT:MULTIPLE:CLOSE?"
          r: "{:d}"
        setter:
          q: "ROUTE:OPEN:ALL; ROUTE:CLOSE (@{:d})"
          r: OK
        specs:
          min: 1
          max: 20
          type: int

resources:
  ASRL5::INSTR:
    device: HMP4040
  GPIB0::24::INSTR:
    device: K2400
  USB0::0x05E6::0x2450::04424778::INSTR:
    device: K2450
  USB0::0x05E6::0x6500::04543021:0:INSTR:
    device: K6500
